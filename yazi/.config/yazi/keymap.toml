[[manager.prepend_keymap]]
on = ["<C-s>"]
run = "plugin fzf"
desc = "Jump to folder with fzf"

[[manager.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[manager.prepend_keymap]]
on   = ["<C-o>"]
run  = 'open --with="markdown:1"'
desc = "Open in iA Writer"
