# ── mise.toml ─────────────────────────────────────────────────────────────
# Tasks for this repo. Runtimes and dev tools are declared globally in
# mise/.config/mise/config.toml (stowed to ~/.config/mise/config.toml).
#
#   mise run bootstrap    # brew bundle + stow

[tasks.bootstrap]
description = "Install Homebrew packages and stow the dotfiles"
run = [
  "brew bundle --file=~/dotfiles/Brewfile --no-upgrade",
  "cd ~/dotfiles && stow nvim tmux zshrc bat gh ghostty starship glow git lazygit sketchybar mise sesh",
]
