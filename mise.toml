# ── mise.toml ─────────────────────────────────────────────────────────────
# Runtimes and version-pinned tools live here. Homebrew packages stay in the
# Brewfile; `mise run bootstrap` calls `brew bundle` so there is one command.
#
#   mise install          # install the [tools] below
#   mise run bootstrap    # brew bundle + stow (see [tasks.bootstrap])

[tools]
node = "lts"
go = "latest"
rust = "stable"
pnpm = "latest"
"npm:typescript" = "6"             # TS 7.x dropped tsserverlibrary.js, astro-ls needs <=6
"npm:css-variable-lsp" = "latest"

# git pager / diff tools
"cargo:git-delta" = "latest"       # aqua build has no darwin/amd64 (Intel) binary, so compile
difftastic = "latest"              # aqua prebuilt binary, installs `difft`

[tasks.bootstrap]
description = "Install Homebrew packages and stow the dotfiles"
run = [
  "brew bundle --file=~/dotfiles/Brewfile --no-upgrade",
  "cd ~/dotfiles && stow nvim tmux zshrc bat gh ghostty starship glow git lazygit sketchybar",
]
